<section class="py-8">
  <div class="container mx-auto px-4">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Shop by Category</h2>
    <owl-carousel-o [options]="customOptions">
      @for (category of allCategories; track category._id) {
        <ng-template carouselSlide [id]="category._id">
          <div class="px-2 cursor-pointer" (click)="navigateToCategory(category)">
            <img [src]="category.image" class="h-64 w-full object-cover rounded-xl" [alt]="category.name">
            <h3 class="text-center font-semibold text-gray-700 mt-2">{{ category.name }}</h3>
          </div>
        </ng-template>
      }
    </owl-carousel-o>
  </div>
</section>
