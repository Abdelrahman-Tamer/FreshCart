<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" aria-label="Product Categories">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Shop by Category</h2>
      <p class="text-xs sm:text-sm text-slate-500">Explore hand-picked essentials for your everyday needs</p>
    </div>
    <a routerLink="/categories" class="text-xs sm:text-sm font-semibold text-emerald-600 hover:text-emerald-700 flex items-center gap-1 transition-colors">
      View All
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </a>
  </div>

  @if (allCategories.length > 0) {
    <owl-carousel-o [options]="customOptions">
      @for (category of allCategories; track category._id) {
        <ng-template carouselSlide [id]="category._id">
          <div class="p-2 cursor-pointer group" (click)="navigateToCategory(category)">
            <div class="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-2xs hover:shadow-md hover:border-emerald-300 transition-all duration-200 text-center flex flex-col items-center">
              <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full overflow-hidden bg-slate-50 mb-3 p-1.5 border border-slate-100 flex items-center justify-center">
                <img [src]="category.image" class="w-full h-full object-cover rounded-full transition-transform duration-300 group-hover:scale-110" [alt]="category.name" loading="lazy">
              </div>
              <h3 class="text-xs sm:text-sm font-semibold text-slate-700 group-hover:text-emerald-600 transition-colors line-clamp-1">
                {{ category.name }}
              </h3>
            </div>
          </div>
        </ng-template>
      }
    </owl-carousel-o>
  }
</section>
