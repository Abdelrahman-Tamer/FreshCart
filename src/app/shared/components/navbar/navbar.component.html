<nav class="bg-gray-200">
  <div class="max-w-screen-2xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a routerLink="/home" class="flex items-center w-auto max-w-[120px] space-x-3 rtl:space-x-reverse">
      <img src="./images/freshcart-logo.svg" class="w-full block" alt="FreshCart">
    </a>
    <button (click)="isMobileMenuOpen = !isMobileMenuOpen" type="button"
      class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
      aria-controls="navbar-default" [attr.aria-expanded]="isMobileMenuOpen">
      <span class="sr-only">Open main menu</span>
      <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15" />
      </svg>
    </button>
    <div [class.hidden]="!isMobileMenuOpen" class="w-full md:flex md:w-[80%]" id="navbar-default">
      <ul class="font-medium flex flex-col p-4 md:p-2 mt-4 border rounded-lg md:flex-row md:space-x-3 rtl:space-x-reverse md:mt-0 md:border-0">
        @if (isLoggedIn) {
          <li class="p-2">
            <a routerLink="/home"
              class="block text-emerald-800 hover:text-emerald-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Home</a>
          </li>
          <li class="p-2">
            <a routerLink="/brands"
              class="block text-emerald-800 hover:text-emerald-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Brands</a>
          </li>
          <li class="p-2">
            <a routerLink="/categories"
              class="block text-emerald-800 hover:text-emerald-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Categories</a>
          </li>
          <li class="p-2">
            <a routerLink="/products"
              class="block text-emerald-800 hover:text-emerald-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Products</a>
          </li>
          <li class="p-2">
            <a routerLink="/cart"
              class="block text-emerald-800 hover:text-emerald-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Cart</a>
          </li>
          <li class="p-2">
            <a routerLink="/wishlist"
              class="block text-emerald-800 hover:text-emerald-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Wishlist</a>
          </li>
          <li class="p-2">
            <a routerLink="/orders"
              class="block text-emerald-800 hover:text-emerald-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Orders</a>
          </li>
        }
      </ul>
      <ul class="ms-auto font-medium flex flex-col p-4 md:p-2 mt-4 border rounded-lg md:flex-row md:items-center md:space-x-3 rtl:space-x-reverse md:mt-0 md:border-0">
        <li class="text-green-800 hover:text-green-400 duration-500">
          <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
        </li>
        <li class="text-green-800 hover:text-green-400 duration-500">
          <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        </li>
        <li class="text-green-800 hover:text-green-400 duration-500">
          <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        </li>
        <li class="text-green-800 hover:text-green-400 duration-500">
          <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        </li>
        <li class="text-green-800 hover:text-green-400 duration-500">
          <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        </li>
        @if (!isLoggedIn) {
          <li class="p-2">
            <a routerLink="/login"
              class="block text-emerald-800 hover:text-emerald-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Login</a>
          </li>
          <li class="p-2">
            <a routerLink="/register"
              class="block text-emerald-800 hover:text-emerald-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Register</a>
          </li>
        }
        @if (isLoggedIn) {
          <li class="p-2">
            <button (click)="logOut()"
              class="block cursor-pointer text-emerald-800 hover:text-red-400 transition-all duration-[0.5s] font-bold py-2 px-3 rounded-sm md:p-0">Signout</button>
          </li>
          <li class="p-2 text-xs text-gray-600">
            Hi, <span class="font-bold text-emerald-800">{{ userName }}</span>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
